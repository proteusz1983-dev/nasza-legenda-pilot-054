<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aurora — Odcinek 2</title></head><body style="margin:0;background:#07090d;color:white"><div id="boot" style="padding:24px;font-family:system-ui">Ładowanie Aurory…</div><script>(async()=>{try{const files=['p1.txt','p2.txt','p3.txt','p4.txt'],b64=(await Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})))).join(''),bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0)),html=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').textContent='Błąd ładowania: '+e}})()</script></body></html>
